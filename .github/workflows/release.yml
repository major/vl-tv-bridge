name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension with web-ext
        run: npm run build

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./firefox/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Sign extension with Mozilla
        run: npm run sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Rename signed XPI
        run: |
          # web-ext sign creates a file like vl_tradingview_bridge-1.0.0.xpi
          SIGNED_XPI=$(find build -name "*.xpi" -type f | grep -v "vl-tv-bridge" | head -n 1)
          if [ -n "$SIGNED_XPI" ]; then
            mv "$SIGNED_XPI" build/vl-tv-bridge-${{ steps.get_version.outputs.VERSION }}-signed.xpi
            echo "Signed XPI renamed to vl-tv-bridge-${{ steps.get_version.outputs.VERSION }}-signed.xpi"
          fi

      - name: List build artifacts
        run: ls -lh build/

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            build/vl-tv-bridge-${{ steps.get_version.outputs.VERSION }}-signed.xpi
            build/vl-tv-bridge-${{ steps.get_version.outputs.VERSION }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
